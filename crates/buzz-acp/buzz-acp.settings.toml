#[goal.classifier]
# Fastino is not optional. A blank url or model still calls
# GLiNER-2.5-Decide. An idle model can take minutes to wake, so the timeout
# is 300 seconds and HTTP 425, 429, and 503 are retried.
# url = "https://api.fastino.ai/v1/chat/completions"
# model = "fastino/GLiNER-2.5-Decide"
# ask_label = "ask"
# issue_label = "work"
# min_confidence = 0.7
# fallback = "ask"
# timeout_secs = 300
#[goal.guard]
# Prompts and the continuation cap. Set any of these in the environment:
# BUZZ_ACP_SET__GOAL__GUARD__NAME_PROMPT
# BUZZ_ACP_SET__GOAL__PHASES__TODO
# BUZZ_ACP_SET__GOAL__PHASES__IN_PROGRESS
# BUZZ_ACP_SET__GOAL__PHASES__IN_REVIEW
# BUZZ_ACP_SET__GOAL__PHASES__BLOCKED
# BUZZ_ACP_SET__GOAL__PHASES__DONE
# BUZZ_ACP_SET__GOAL__GUARD__POST_PLACEMENT
# post_placement is thread or channel. It places the issue link and the
# work-loop updates. The default is thread.
# BUZZ_ACP_SET__GOAL__GUARD__CONTINUE_PROMPT
# BUZZ_ACP_SET__GOAL__GUARD__EXPLAIN_PROMPT
# BUZZ_ACP_SET__GOAL__GUARD__ISSUE_INSTRUCTIONS
# BUZZ_ACP_SET__GOAL__GUARD__MAX_CONTINUATIONS
