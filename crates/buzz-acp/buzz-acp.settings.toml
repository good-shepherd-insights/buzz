# buzz-acp settings. Every key is required: a missing key is a load error (no defaults in code).
# Loaded from BUZZ_ACP_SETTINGS_FILE. Any key can be overridden per process with
# BUZZ_ACP_SET__<TABLE>__<KEY>=<toml value>  (upper-case, double underscore; nested table:
# BUZZ_ACP_SET__TEXT__PROMPT_LABELS__<KEY>). Unparseable override values are taken as strings.
# Text values containing {name} are rendered with settings::render; the placeholder names are
# listed in the comment above each key. Keys marked "literal" are never rendered.

